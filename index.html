<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a08" />
    <link
      data-trunk
      rel="icon"
      href="assets/favicon-16-v3.png"
      type="image/png"
      sizes="16x16"
    />
    <link
      data-trunk
      rel="icon"
      href="assets/favicon-32-v3.png"
      type="image/png"
      sizes="32x32"
    />
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon-v3.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon-v3.png" sizes="180x180" />
    <meta
      name="description"
      content="Open a MIDI file and visualize it across a full computer keyboard."
    />
    <title>K2 MIDI Viewer</title>
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090a08;
      }

      body {
        font-family: system-ui, sans-serif;
      }

      canvas {
        display: block;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #090a08;
        z-index: 1000;
        transition: opacity 0.35s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loading-screen .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(240, 232, 216, 0.15);
        border-top-color: #d98e4c;
        animation: loading-spin 0.9s linear infinite;
      }

      #loading-screen .title {
        color: #f0e8d8;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.85;
      }

      #loading-screen .retry {
        display: none;
        color: #d98e4c;
      }

      #loading-screen.failed .spinner { display: none; }
      #loading-screen.failed .retry { display: block; }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>K2 MIDI Viewer requires JavaScript and WebAssembly.</noscript>
    <div id="loading-screen">
      <div class="spinner"></div>
      <div class="title">Loading K2 MIDI Viewer&hellip;</div>
      <a class="retry" href="">Reload viewer</a>
    </div>
    <script>
      // Rust hides this after the first window frame. Bootstrap failures can
      // occur before Rust starts, so this small HTML fallback must live here.
      function showStartupFailure() {
        const el = document.getElementById("loading-screen");
        if (el && !el.classList.contains("hidden")) {
          el.classList.add("failed");
          el.querySelector(".title").textContent =
            "K2 could not finish starting. Please reload.";
        }
      }
      window.addEventListener("unhandledrejection", showStartupFailure);
      window.setTimeout(() => {
        const el = document.getElementById("loading-screen");
        if (el && !el.classList.contains("hidden")) {
          showStartupFailure();
        }
      }, 45000);
    </script>
  </body>
</html>
